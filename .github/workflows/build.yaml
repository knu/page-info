name: Build

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Skipped for tag builds so release artifacts cannot be affected by
      # a poisoned cache
      - name: Setup pnpm cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm exec eslint src/

      - name: Test
        run: pnpm test

      - name: Build
        run: |
          pnpm build

      - name: Create extension zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          zip -r "../page-info-${GITHUB_REF_NAME}.zip" . -x '.vite/*'

      # `make release` normally creates the release with notes from
      # CHANGELOG.md before this step attaches the zip; the create call is
      # a fallback for tag-only pushes
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "page-info-${TAG}.zip" --clobber
