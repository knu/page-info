name: Lockfile maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5" # Friday 09:00 JST

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          version: "12.12.1"

      - uses: knu/lockfile-maintenance-action@051d96d8e3b8e05234a66b6c2c8c76d30c1cf831 # v2.1.1
        with:
          files: /pnpm-lock.yaml
          minimum-release-age: 3 days
