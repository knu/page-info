name: Lockfile maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5" # Friday 09:00 JST

concurrency:
  group: lockfile-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
          version: "12.18.0"

      - uses: knu/lockfile-maintenance-action@v2
        with:
          files: /pnpm-lock.yaml
          minimum-release-age: 3 days

      - name: Maintain action pins
        uses: knu/lockfile-maintenance-action@v2
        with:
          files: /.github/workflows/actions.lock
          minimum-release-age: 7 days
          branch: automation/actions-lock-maintenance
